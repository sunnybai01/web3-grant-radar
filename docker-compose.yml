# Pinned so the pgdata / chroma_data volumes keep resolving to
# web3-automated-agent_* even if the checkout directory is renamed.
name: web3-automated-agent

services:
  chat-api:
    build: .
    container_name: grant_radar_chat_api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn src.chat_api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"

  pipeline:
    build: .
    container_name: grant_radar_pipeline
    env_file:
      - .env
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped
    command: python -m src.main

  postgres:
    image: pgvector/pgvector:pg16
    container_name: grant_radar_postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-web3agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-web3agent}
      POSTGRES_DB: ${POSTGRES_DB:-web3agent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-web3agent}"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: grant_radar_chromadb
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      # The server image persists under /data. The previous /chroma/chroma mount
      # silently held a stale file from July: every vector indexed after a restart
      # landed outside the volume, so L2 semantic dedup kept losing its history.
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_DB_IMPL=sqlite

volumes:
  pgdata:
  chroma_data:
